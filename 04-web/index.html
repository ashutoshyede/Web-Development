<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - Lets learn it</title>
</head>

<body>
    <h1>Basic information form</h1>
    <form action="post">
        <div style="margin-bottom: 10px;">
            <label for="username">Name:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" autofocus>
        </div>

        <div style="margin-bottom: 10px;">
            <label for="city">City:</label>
            <select name="city" id="city">
                <option value="balaghat">Balaghat</option>
                <option value="Bhopal">Bhopal</option>
                <option value="london">London</option>
                <option value="chicago">Chicago</option>
                <option value="houston">Houston</option>
                <option value="phoenix">Phoenix</option>
                <option value="philadelphia">Philadelphia</option>
                <option value="sanantonio">San Antonio</option>
                <option value="sandiego">San Diego</option>
                <option value="dallas">Dallas</option>
                <option value="sanjose">San Jose</option>
                <option value="austin">Austin</option>
                <option value="jacksonville">Jacksonville</option>
                <option value="fortworth">Fort Worth</option>
                <option value="columbus">Columbus</option>
                <option value="charlotte">Charlotte</option>
                <option value="seattle">Seattle</option>
                <option value="denver">Denver</option>
                <option value="boston">Boston</option>
                <option value="nashville">Nashville</option>
                <option value="portland">Portland</option>

            </select>
        </div>

        <div>
            <label for="pincode">Pincode:</label>
            <input type="text" id="pincode" name="pincode" placeholder="Enter your pincode">
        </div>

        <button type="submit">Submit</button>
    </form>
</body>

</html>
